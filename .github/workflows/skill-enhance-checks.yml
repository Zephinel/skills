name: Skill Enhance Checks

run-name: Skill Enhance Checks · ${{ github.event_name }} · ${{ github.event.pull_request.number || github.ref_name }}

on:
  pull_request:
    branches:
      - main
    paths:
      - "skills/skill-enhance/**"
      - ".github/workflows/skill-enhance-checks.yml"
  push:
    branches:
      - main
    paths:
      - "skills/skill-enhance/**"
      - ".github/workflows/skill-enhance-checks.yml"

concurrency:
  group: skill-enhance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete skill-enhance regression suite
        id: regression
        shell: bash
        run: |
          set +e
          bash skills/skill-enhance/scripts/test-all.sh > skill-enhance-test.log 2>&1
          status=$?
          cat skill-enhance-test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload regression log on failure
        if: ${{ steps.regression.outputs.status != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: skill-enhance-regression-${{ matrix.os }}
          path: skill-enhance-test.log
          retention-days: 7
      - name: Enforce regression result
        if: ${{ steps.regression.outputs.status != '0' }}
        run: exit 1
